# EIDP Workflow Update Release Documentation

## Action

Follow the update-release-documentation workflow:
1. Update or create release exception record in docs/reports/
2. Update the current objective evidence checklist in docs/reports/eidp-current-objective-evidence-checklist.md
3. Update or refresh the admin checklist in docs/runbooks/eidp-v1-release-admin-checklist.md (if needed)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/reports/eidp-current-objective-evidence-checklist.md, docs/reports/2026-05-19-publication-lag-release-exception-record.md, docs/reports/2026-06-19-v530-windows-connectivity-recheck.md

