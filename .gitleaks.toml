title = "EIDP gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "firecrawl-api-key"
description = "Firecrawl API key (fc- prefix, 32 hex chars)"
regex = '''\bfc-[a-f0-9]{32}\b'''
keywords = ["fc-"]
tags = ["secret", "firecrawl", "apikey"]

[[rules]]
id = "duckduckgo-ddg-key"
description = "Generic DDG/Brave/Serper/Google API key placeholder catch"
regex = '''(?i)(brave|serper|google)[_-]?api[_-]?key\s*=\s*['"]?[A-Za-z0-9_-]{24,}['"]?'''
tags = ["secret", "apikey"]

[allowlist]
description = "Allowlist for known-safe patterns"
paths = [
    '''\.env\.example$''',
    '''tests/fixtures/''',
]
regexes = [
    '''fc-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX''',
    '''your-api-key-here''',
]
