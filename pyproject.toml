[project]
name = "eidp"
version = "0.2.0"
description = "Education Institution Data Pipeline — Automated enrollment data collection for Japanese schools"
# readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "typer>=0.16,<1.0",
    "structlog>=25.0",
    "streamlit>=1.45,<2.0",
]

[project.optional-dependencies]
scraper = [
    "scrapy>=2.14,<3.0",
    "httpx>=0.28,<1.0",
    "playwright>=1.58",
    "tenacity>=9.0,<10.0",
]
pdf = [
    "pdfplumber>=0.11,<1.0",
    "pymupdf>=1.25,<2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
]

[project.scripts]
eidp = "eidp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidp"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
