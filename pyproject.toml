[project]
name = "eidp"
version = "1.0.0rc1"
description = "Education Institution Data Pipeline — Automated enrollment data collection for Japanese schools"
# readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "jsonschema>=4.0,<5.0",
    "typer>=0.16,<1.0",
    "structlog>=25.0",
    "streamlit>=1.45,<2.0",
]

[project.optional-dependencies]
# Optional PostgreSQL backing. Linux/Web v1 continues to use SQLite until the
# multi-operator concurrency trigger is approved.
postgres = [
    "psycopg2-binary>=2.9,<3.0",
]
# HTTP-only scraper extra. Pure Python; no Chromium required.
scraper-basic = [
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "ddgs>=8.0",
]
# Optional Playwright + Chromium support for rendered pages.
scraper-playwright = [
    "scrapy>=2.14,<3.0",
    "playwright>=1.58",
]
# Scrapling fetchers — optional add-on used by the v104 school URL
# auto-crawl fallback. Kept optional so the official-index path does not need
# Chromium/browser dependencies.
scraper-scrapling = [
    "scrapling[fetchers]>=0.4.7,<1.0",
]
# Combined scraper kept as compatibility alias for existing callers
# still installing ``eidp[scraper]``.
scraper = [
    "eidp[scraper-basic]",
    "eidp[scraper-playwright]",
]
pdf = [
    "pdfplumber>=0.11,<1.0",
    "pymupdf>=1.25,<2.0",
]
ocr = [
    "pymupdf>=1.25,<2.0",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
]

[project.scripts]
eidp = "eidp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidp"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
# Generated migrations and archived one-off research utilities retain their
# historical formatting. Product code, tests, and all new scripts remain in
# the default `ruff check .` surface.
extend-exclude = [
    "migrations",
    "scripts/debug",
    "scripts/analyze_nkz_pdf_embed.py",
    "scripts/analyze_nkz_subpages.py",
    "scripts/analyze_reference_urls.py",
    "scripts/analyze_target_institutions.py",
    "scripts/analyze_zero_pdf_sites.py",
    "scripts/dept_unmatched_resolver.py",
    "scripts/generate_briefing_pdf.py",
    "scripts/generate_report.py",
    "scripts/http_verify_plan_urls.py",
    "scripts/investigate_unmatched.py",
    "scripts/jikei_url_rediscovery.py",
    "scripts/match_schools.py",
    "scripts/md_to_pdf.py",
    "scripts/rescue_suspect_urls.py",
    "scripts/school_missing_resolver.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
