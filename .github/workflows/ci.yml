name: CI

on:
  push:
    branches:
      - main
      - sprint8-handoff-finalize
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra scraper-basic --extra pdf

      - name: Ruff
        run: >
          uv run ruff check
          src
          scripts/build_windows_zip.py
          scripts/validate_windows_install.py
          scripts/verify_windows_distribution.py
          scripts/run_non_windows_release_gates.py
          scripts/run_retroactive_excel_matrix.py
          scripts/collect_stage6_evidence.py
          scripts/collect_bug_report.py
          scripts/verify_stage6_evidence.py
          scripts/stage6_recovery_check.py
          scripts/stage6_residual_cleanup.py
          tests/unit/test_current_read_paths.py
          tests/unit/test_db_session.py
          tests/unit/test_fiscal_year_evidence.py
          tests/unit/test_package_init.py
          tests/unit/test_retroactive_excel_matrix.py
          tests/unit/test_windows_install_validator.py
          tests/unit/test_non_windows_release_gates.py
          tests/unit/test_stage6_evidence_bundle.py
          tests/unit/test_bug_signals.py
          tests/unit/test_review_bug_report.py
          tests/unit/test_bug_report_packaging.py
          tests/unit/test_windows_distribution_verifier.py
          tests/unit/test_stage6_recovery_check.py
          tests/unit/test_stage6_residual_cleanup.py
          tests/unit/test_ci_workflow_contract.py

      - name: Bandit high-severity security scan
        run: >
          uv run --with bandit bandit
          -q
          --severity-level high
          -r
          src/eidp
          scripts/build_windows_zip.py
          scripts/validate_windows_install.py
          scripts/verify_windows_distribution.py
          scripts/run_non_windows_release_gates.py
          scripts/run_retroactive_excel_matrix.py
          scripts/collect_stage6_evidence.py
          scripts/collect_bug_report.py
          scripts/verify_stage6_evidence.py
          scripts/stage6_recovery_check.py
          scripts/stage6_residual_cleanup.py

      - name: Mypy
        run: >
          uv run mypy
          src
          scripts/run_retroactive_excel_matrix.py
          scripts/collect_bug_report.py

      - name: Pytest with coverage
        run: uv run pytest --cov=src/eidp --cov-report=term --cov-fail-under=80

      - name: Download Windows runtime
        run: uv run python scripts/download_windows_runtime.py

      - name: Build Windows ZIP
        run: uv run python scripts/build_windows_zip.py --out-zip dist/eidp-windows-ci.zip

      - name: Non-Windows release gate
        run: >
          uv run python scripts/run_non_windows_release_gates.py
          dist/eidp-windows-ci.zip
          --skip-full-unit
          --json
          --output logs/release-gate-ci.json
