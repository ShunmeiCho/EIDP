name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra scraper-basic --extra pdf

      - name: Ruff
        run: uv run ruff check .

      - name: Bandit high-severity security scan
        run: uv run --with bandit bandit -q --severity-level high -r src/eidp scripts

      - name: Mypy
        run: uv run mypy src

      - name: Pytest with coverage
        run: uv run pytest --cov=src/eidp --cov-report=term --cov-fail-under=80

  ship-gate:
    # Keep this required-check name stable while replacing the retired Windows
    # gate with the Linux/Web served-app contract.
    name: Ship gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra pdf

      - name: Linux/Web served-app contract tests
        run: >
          uv run pytest
          tests/unit/test_linux_web_release_contract.py
          tests/unit/test_web_write_lock_contract.py
          tests/unit/test_app_root_paths.py
          tests/integration/test_linux_web_e2e_chain.py
          tests/integration/test_served_linux_web_chain.py
          -q

      - name: Web entry-point import smoke
        run: >
          EIDP_APP_ROOT="$GITHUB_WORKSPACE"
          EIDP_DATA_DIR="$RUNNER_TEMP/eidp-data"
          uv run python -c
          "from eidp.web.app import main; assert callable(main)"

      - name: Streamlit loopback health smoke
        run: |
          EIDP_IDENTITY_MODE=configured_fallback EIDP_FALLBACK_ACTOR=ci-smoke STREAMLIT_SERVER_PORT=8502 deploy/linux/run_web.sh >"$RUNNER_TEMP/eidp-streamlit.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8502/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 "$RUNNER_TEMP/eidp-streamlit.log"
          exit 1
